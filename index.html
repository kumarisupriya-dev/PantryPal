<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>PantryPal - Your Kitchen Companion</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,400&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="app">
    <header class="site-header">
      <div class="brand">
        <span class="brand-icon">🌿</span>
        <h1>PantryPal</h1>
      </div>
        <p class="tagline">Tell me what's in your kitchen. I'll take care of dinner.</p>
    </header>
    <main class="main-layout">
        <section class="shelf-panel">
            <h2>My Pantry Shelf</h2>
            <p class="placeholder-text">Ingredients will appear here.</p>
        </section>
        <section class="chat-panel">
            <h2>Chef Sam</h2>
            <div id="chat-message" class="chat-messages">
                <div class="message bot-message">
                    Hello! What ingredients do you have in your fridge or pantry right now?
                </div>
            </div>
        </section>
    </main>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
